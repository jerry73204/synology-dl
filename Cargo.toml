[package]
name = "synology-dl"
version = "0.1.0"
edition = "2021"
description = "Synology Drive public link downloader"

[dependencies]
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["cookies", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
futures-util = "0.3"
indicatif = "0.17"

[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true
